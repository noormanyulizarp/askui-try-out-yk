image:
  file: .gitpod.Dockerfile

tasks:
  - command: |
      # Function to wait for MEGA CMD server to be ready
      wait_for_mega_cmd() {
          echo "Waiting for MEGA CMD server to be ready..."
          while ! mega-whoami &> /dev/null; do
              sleep 1
              echo "Still waiting for MEGA CMD server..."
          done
          echo "MEGA CMD server is ready."
      }

      # Start MEGA CMD server
      mega-cmd-server &
      
      # Wait for the server to be ready before proceeding
      wait_for_mega_cmd
      
      # Mount MEGA storage
      mount-cloud-storage.sh &

      # Install bpytop
      echo "Installing bpytop..."
      sudo apt-get update
      sudo apt-get install -y python3-pip
      pip3 install bpytop --upgrade

      # Install Git Delta
      echo "Installing Git Delta..."
      sudo apt-get install -y git-delta

      # Configure Git to use Delta
      echo "Configuring Git to use Delta..."
      git config --global core.pager "delta"
      git config --global delta.side-by-side true
      git config --global delta.line-numbers true
      git config --global delta.syntax-theme "GitHub"
      
      # Switch to Zsh as the default shell
      exec zsh

ports:
  - port: 6080
    onOpen: open-preview
